<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Real-time chat application</title><desc id="desc">A generated messaging interface showing conversations, contacts, and active users.</desc>
  <rect width="1200" height="750" fill="#7568ff"/><path d="M0 0h510L220 750H0z" fill="#6255eb"/><circle cx="1050" cy="87" r="160" fill="#d8f45a" fill-opacity=".18"/>
  <g transform="translate(78 70)"><rect width="1044" height="610" rx="30" fill="#fff" filter="drop-shadow(0 28px 28px rgba(26,20,85,.32))"/><rect width="290" height="610" rx="28" fill="#171b25"/><text x="35" y="64" font-family="Arial" font-size="24" font-weight="700" fill="#fff">Messages</text><rect x="35" y="92" width="220" height="42" rx="21" fill="#292f3d"/><text x="60" y="118" font-family="Arial" font-size="13" fill="#8f97a6">Search conversations</text>
  <g transform="translate(20 164)"><rect width="250" height="86" rx="18" fill="#7568ff"/><circle cx="42" cy="43" r="24" fill="#d8f45a"/><text x="80" y="37" font-family="Arial" font-size="16" font-weight="700" fill="#fff">Product team</text><text x="80" y="61" font-family="Arial" font-size="12" fill="#e0ddff">Maya: Looks ready to ship!</text></g>
  <g font-family="Arial"><circle cx="62" cy="300" r="24" fill="#ff8e72"/><text x="100" y="294" font-size="16" font-weight="700" fill="#fff">Alex Morgan</text><text x="100" y="318" font-size="12" fill="#8f97a6">Sent a photo · 2m</text><circle cx="62" cy="384" r="24" fill="#63d6c5"/><text x="100" y="378" font-size="16" font-weight="700" fill="#fff">Jamie Chen</text><text x="100" y="402" font-size="12" fill="#8f97a6">Sounds perfect · 8m</text><circle cx="62" cy="468" r="24" fill="#f5bf55"/><text x="100" y="462" font-size="16" font-weight="700" fill="#fff">Riya Shah</text><text x="100" y="486" font-size="12" fill="#8f97a6">Thank you! · 1h</text></g>
  <text x="330" y="55" font-family="Arial" font-size="19" font-weight="700" fill="#171b25">Product team</text><circle cx="1010" cy="49" r="17" fill="#d8f45a"/><text x="330" y="81" font-family="Arial" font-size="12" fill="#737782">5 members · 3 online</text><path d="M290 105h754" stroke="#e6e4ee"/>
  <g font-family="Arial"><circle cx="345" cy="159" r="24" fill="#ff8e72"/><rect x="383" y="133" width="385" height="82" rx="19" fill="#f0eff5"/><text x="405" y="164" font-size="14" fill="#171b25">The latest build is looking great.</text><text x="405" y="190" font-size="14" fill="#171b25">Can everyone review before launch?</text><text x="786" y="203" font-size="11" fill="#92949c">09:42</text>
  <rect x="580" y="254" width="404" height="72" rx="19" fill="#7568ff"/><text x="604" y="284" font-size="14" fill="#fff">Just reviewed the checkout flow.</text><text x="604" y="307" font-size="14" fill="#fff">Everything feels smooth!</text><text x="997" y="316" font-size="11" fill="#92949c">09:45</text>
  <circle cx="345" cy="391" r="24" fill="#63d6c5"/><rect x="383" y="360" width="455" height="96" rx="19" fill="#f0eff5"/><text x="405" y="391" font-size="14" fill="#171b25">I added the final mobile polish too.</text><rect x="405" y="414" width="120" height="25" rx="12" fill="#d8f45a"/><text x="425" y="431" font-size="11" font-weight="700" fill="#171b25">READY TO SHIP</text>
  <rect x="330" y="524" width="650" height="54" rx="27" fill="#f0eff5"/><text x="360" y="557" font-size="14" fill="#92949c">Write a message...</text><circle cx="1010" cy="551" r="27" fill="#171b25"/><path d="m999 551 9 9 15-18" fill="none" stroke="#d8f45a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></g>
</svg>
