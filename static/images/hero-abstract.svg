    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="800" height="960" fill="url(#ground)"/>
