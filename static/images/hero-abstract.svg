<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" role="img" aria-labelledby="title desc">
  <title id="title">Developer workspace illustration</title>
  <desc id="desc">An abstract dark workspace with code, interface panels, and lime geometric accents.</desc>
  <defs>
